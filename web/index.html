    <meta http-equiv="expires" content="0">

    <!-- 基础设置 -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NanShare</title>

    <!-- SEO相关 -->
    <meta name="Robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="never">
    <meta name="description" content="NanShare">
    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">

    <!-- 图标设置 -->
    <link rel="icon" type="image/png" href="assets/images/app-icon.png">
    <link rel="shortcut icon" type="image/png" href="assets/images/app-icon.png">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NanShare">
    <meta name="format-detection" content="telephone=no">

    <!-- 主题颜色 -->

    <meta name="color-scheme" content="light dark">

    <style>
        /* 检测灵动岛的安全区域 */
        @supports(padding-top: env(safe-area-inset-top)) {
            :root {
                --safe-area-inset-top: env(safe-area-inset-top);
                --safe-area-inset-bottom: env(safe-area-inset-bottom);
                --safe-area-inset-left: env(safe-area-inset-left);
                --safe-area-inset-right: env(safe-area-inset-right);
